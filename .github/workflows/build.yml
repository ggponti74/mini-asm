name: Build

# Trigger only when manually requested
on:
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Makefile
        run: make --always-make TARGET=X86
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-asm-arm
          path: build/output/*
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (Windows native)
        run: make TARGET=X86  
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-asm-win
          path: build/output/*
