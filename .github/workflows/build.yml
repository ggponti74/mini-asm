name: Build

# Trigger only when manually requested
on:
  workflow_dispatch:

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Makefile
        run: make --always-make TARGET=X86
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-asm
          path: mini-asm.exe
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
      - name: Build (Windows)
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm x86_64-elf-gcc
          make TARGET=X86 CC=x86_64-elf-gcc
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-asm
          path: mini-asm
